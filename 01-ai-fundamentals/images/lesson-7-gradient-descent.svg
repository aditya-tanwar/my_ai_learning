<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Gradient descent moving toward a minimum</title><desc id="desc">A loss curve with successive parameter updates descending toward the minimum.</desc>
<defs><marker id="axis" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="650" rx="24" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Gradient descent: reducing the loss</text>
<g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#axis)"><path d="M150 530 L1080 530"/><path d="M150 530 L150 110"/></g>
<g font-family="Arial,sans-serif" font-size="22" fill="#334155"><text x="610" y="590" text-anchor="middle">Parameter value (weight)</text><text x="65" y="320" transform="rotate(-90 65 320)" text-anchor="middle">Loss</text></g>
<path d="M190 160 C360 175 420 440 650 470 C820 490 930 470 1040 455" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
<g stroke="#2563eb" stroke-width="4" fill="#dbeafe" marker-end="url(#step)"><path d="M300 205 L420 350"/><path d="M420 350 L530 430"/><path d="M530 430 L635 465"/></g>
<g fill="#2563eb" stroke="#fff" stroke-width="4"><circle cx="300" cy="205" r="12"/><circle cx="420" cy="350" r="12"/><circle cx="530" cy="430" r="12"/><circle cx="635" cy="465" r="12"/></g>
<circle cx="650" cy="470" r="17" fill="#f59e0b" stroke="#fff" stroke-width="5"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#1e293b"><text x="260" y="175">Initial value</text><text x="670" y="445">Minimum loss</text><text x="770" y="180">Each update moves opposite</text><text x="770" y="208">the gradient direction</text></g>
<path d="M735 215 L655 390" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Illustrative curve — actual loss landscapes can be much more complex</text>
</svg>