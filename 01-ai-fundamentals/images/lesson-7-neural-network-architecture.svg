<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Neural network architecture</title><desc id="desc">Input layer, two hidden layers, and output layer connected by forward-propagation arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">A simple feed-forward neural network</text>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M180 220 L420 160"/><path d="M180 220 L420 300"/><path d="M180 400 L420 160"/><path d="M180 400 L420 300"/>
<path d="M460 160 L700 120"/><path d="M460 160 L700 250"/><path d="M460 300 L700 120"/><path d="M460 300 L700 250"/>
<path d="M740 120 L980 270"/><path d="M740 250 L980 270"/>
</g>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><circle cx="160" cy="220" r="38"/><circle cx="160" cy="400" r="38"/></g>
<g fill="#dcfce7" stroke="#16a34a" stroke-width="3"><circle cx="440" cy="160" r="38"/><circle cx="440" cy="300" r="38"/><circle cx="720" cy="120" r="38"/><circle cx="720" cy="250" r="38"/></g>
<circle cx="1000" cy="270" r="44" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<g font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a"><text x="160" y="227">CPU</text><text x="160" y="407">RAM</text><text x="440" y="167">h₁</text><text x="440" y="307">h₂</text><text x="720" y="127">h₃</text><text x="720" y="257">h₄</text><text x="1000" y="277">ŷ</text></g>
<g font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#334155"><text x="160" y="500">Input layer</text><text x="440" y="500">Hidden layer 1</text><text x="720" y="500">Hidden layer 2</text><text x="1000" y="500">Output layer</text></g>
<text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Information moves from left to right during forward propagation</text>
</svg>